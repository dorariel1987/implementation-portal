services:
  db:
    image: postgres:16-alpine
    container_name: implementation-portal-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal
      POSTGRES_DB: implementation_portal
    ports:
      - "5544:5432"
    volumes:
      - portal_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d implementation_portal"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  portal_pgdata:
